spring:
  application:
    name: aiops-incident-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:aiops;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
server:
  port: ${PORT:8080}
aiops:
  anomaly:
    base-url: ${ANOMALY_SERVICE_URL:http://localhost:8000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: aiops-incident-api
springdoc:
  swagger-ui:
    path: /swagger-ui.html
